<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>蔵置所 出庫記録</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出庫記録">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header id="app-header">
  <button id="btn-back" class="icon-btn" aria-label="戻る" hidden>← 戻る</button>
  <h1 id="header-title">蔵置所 出庫記録</h1>
  <span id="queue-badge" class="badge" hidden>0</span>
</header>

<main id="app-main">

  <!-- 入力フォーム -->
  <section id="screen-form" class="screen">
    <div id="notice" class="notice" hidden></div>

    <label class="field-label" for="in-date">日付</label>
    <input id="in-date" class="text-input" type="date">

    <label class="field-label" for="in-partner">相手先</label>
    <input id="in-partner" class="text-input" type="text" list="partner-list" autocomplete="off" placeholder="例：酒ハウスモリモト">
    <datalist id="partner-list"></datalist>

    <span class="field-label">販路区分</span>
    <div id="channel-grid" class="choice-grid"></div>

    <span class="field-label">品目</span>
    <div id="items"></div>
    <button id="btn-add-item" class="secondary-btn">＋ もう1品追加</button>

    <label class="field-label" for="in-recorder">記録者</label>
    <input id="in-recorder" class="text-input" type="text" autocomplete="off" placeholder="あなたの名前">

    <p id="form-error" class="error-line" hidden></p>
    <button id="btn-to-confirm" class="primary-btn">確認する</button>

    <div class="home-footer">
      <button id="btn-goto-history" class="link-btn">送信履歴・未送信</button>
      <button id="btn-goto-settings" class="link-btn">⚙ 設定</button>
    </div>
  </section>

  <!-- 確認 -->
  <section id="screen-confirm" class="screen" hidden>
    <h2>この内容で送信しますか？</h2>
    <ul id="confirm-list" class="confirm-list"></ul>
    <button id="btn-confirm-send" class="primary-btn primary-btn--big">送信する</button>
    <button id="btn-confirm-back" class="secondary-btn">直す</button>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen" hidden>
    <p id="result-icon" class="result-icon"></p>
    <h2 id="result-title"></h2>
    <p id="result-message" class="hint"></p>
    <button id="btn-result-again" class="primary-btn">続けて記録する</button>
  </section>

  <!-- 履歴 -->
  <section id="screen-history" class="screen" hidden>
    <h2>未送信・確認中</h2>
    <p id="queue-empty-msg" class="hint" hidden>未送信の記録はありません。</p>
    <ul id="queue-list" class="list"></ul>
    <button id="btn-flush-now" class="primary-btn">今すぐ送信・確認する</button>
    <p id="flush-msg" class="status-line"></p>
    <h2>送信履歴（直近20件）</h2>
    <ul id="history-list" class="list"></ul>
  </section>

  <!-- 設定 -->
  <section id="screen-settings" class="screen" hidden>
    <h2>設定</h2>
    <label class="field-label" for="input-url">送信先URL</label>
    <p class="hint">システム責任者（新居）から受け取ったURLを貼り付けてください。このスマホにだけ保存され、アプリのコードには入っていません。</p>
    <textarea id="input-url" class="text-input" rows="3" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
    <button id="btn-save-url" class="primary-btn">保存する</button>
    <p id="settings-msg" class="status-line"></p>
    <hr>
    <p id="masters-status" class="hint"></p>
    <button id="btn-refresh-masters" class="secondary-btn">銘柄・容器を再取得する</button>
  </section>

</main>

<div id="modal-confirm" class="modal" hidden>
  <div class="modal-box">
    <p id="modal-message"></p>
    <div class="modal-actions">
      <button id="modal-btn-yes" class="primary-btn">はい</button>
      <button id="modal-btn-no" class="secondary-btn">いいえ</button>
    </div>
  </div>
</div>

<script src="./js/core.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
